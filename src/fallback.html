      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 34rem;
        padding: 2.5rem;
        text-align: center;
      }
      img {
        width: 208px;
        max-width: 100%;
        height: auto;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.6;
        color: #475569;
      }
      code {
        display: inline-block;
        padding: 0.35rem 0.6rem;
        border-radius: 0.4rem;
        background: #e2e8f0;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.85rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #e2e8f0;
        }
        p {
          color: #94a3b8;
        }
        code {
          background: #1e293b;
        }
      }
