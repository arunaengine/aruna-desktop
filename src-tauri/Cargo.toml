[package]
name = "aruna-desktop"
version = "0.1.0"
description = "Desktop shell for a local Aruna user node"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arunaengine/aruna-desktop"

[lib]
# The bin and the lib cannot share a name on Windows.
name = "aruna_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "aruna-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
# rustls carries the platform verifier, so a realm behind a private CA works
# wherever the system trusts it.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
