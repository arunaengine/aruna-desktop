name: release

# One installer per platform, each carrying the app, the aruna node it
# supervises and the portal it serves. The aruna and portal releases come from
# versions.json. A tag publishes a GitHub release; a manual run only uploads
# the bundles as workflow artifacts. With the update signing secrets set, the
# installers are signed and the release carries the latest.json the app's
# in-app update reads.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest runner image sets the glibc floor of the Linux bundles.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          # MSI rejects pre-release versions, so only NSIS is built.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # The app bundle is what the updater archives and replaces.
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned versions
        id: pins
        shell: bash
        run: |
          echo "aruna_ref=$(jq -r '.aruna.ref' versions.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.aruna.version' versions.json)" >> "$GITHUB_OUTPUT"

      - name: Check the tag against the pinned version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.pins.outputs.version }}"

      - uses: actions/checkout@v4
        with:
          repository: arunaengine/aruna
          ref: ${{ steps.pins.outputs.aruna_ref }}
          path: aruna

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            aruna -> target

      - name: Install the Linux webview, linker and bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the node and install it as the sidecar
        shell: bash
        env:
          ARUNA_DIR: ${{ github.workspace }}/aruna
          ARUNA_TARGET_TRIPLE: ${{ matrix.target }}
        run: bash scripts/sync-node.sh

      - name: Install the portal
        shell: bash
        run: bash scripts/sync-frontend.sh

      # The public key is configuration, not a secret; without both halves the
      # bundles are built unsigned and the app keeps the download fallback.
      - name: Prepare the update signing
        id: signing
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$PUBKEY" ] && [ "$HAS_KEY" = true ]; then
            jq -n --arg key "$PUBKEY" '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}' > "$RUNNER_TEMP/updater.json"
            echo "config=$RUNNER_TEMP/updater.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_UPDATER_PUBKEY or TAURI_SIGNING_PRIVATE_KEY is not set; the bundles get no in-app update"
          fi

      - name: Bundle the app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          extra=()
          if [ -n "$UPDATER_CONFIG" ]; then extra=(--config "$UPDATER_CONFIG"); fi
          npx --yes @tauri-apps/cli@2.11.5 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${extra[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: aruna-desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/*/*.sig

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/*/*.sig

  # Runs after every platform, so one that failed only loses its own entry.
  manifest:
    needs: bundle
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish the update manifest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sigs"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$RUNNER_TEMP/sigs" || true
          if ! compgen -G "$RUNNER_TEMP/sigs/*.sig" >/dev/null; then
            echo "::warning::the release has no update signatures, so no latest.json is published"
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          bash scripts/update-manifest.sh "${GITHUB_REF_NAME#v}" "$base" "$RUNNER_TEMP/sigs" > "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
