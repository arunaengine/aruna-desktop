name: release

# One installer per platform, each carrying the app, the aruna node it
# supervises and the portal it serves. A tag publishes a GitHub release; a
# manual run only uploads the bundles as workflow artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      aruna_ref:
        description: aruna ref the node is built from
        default: main
      website_ref:
        description: website ref the portal is built from
        default: main

permissions:
  contents: write

env:
  ARUNA_REF: ${{ github.event.inputs.aruna_ref || 'main' }}
  WEBSITE_REF: ${{ github.event.inputs.website_ref || 'main' }}

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            node: aruna
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            node: aruna.exe
          - os: macos-14
            target: aarch64-apple-darwin
            node: aruna
          - os: macos-13
            target: x86_64-apple-darwin
            node: aruna
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: arunaengine/aruna
          ref: ${{ env.ARUNA_REF }}
          path: aruna

      - uses: actions/checkout@v4
        with:
          repository: arunaengine/website
          ref: ${{ env.WEBSITE_REF }}
          path: website

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            aruna -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install the Linux webview and bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the node
        working-directory: aruna
        run: cargo build --release -p aruna --target ${{ matrix.target }}

      - name: Install the node as the sidecar
        shell: bash
        env:
          ARUNA_NODE_BIN: aruna/target/${{ matrix.target }}/release/${{ matrix.node }}
          ARUNA_TARGET_TRIPLE: ${{ matrix.target }}
        run: bash scripts/sync-node.sh

      - name: Install the portal
        shell: bash
        env:
          ARUNA_WEBSITE_DIR: website
        run: bash scripts/sync-frontend.sh

      - name: Bundle the app
        run: npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: aruna-desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
